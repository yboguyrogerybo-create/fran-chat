
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>FRAN-CHAT</title><style>body{margin:0;background:#111b21;color:#fff;height:100vh;display:flex;flex-direction:column;font-family:Arial}header{background:#202c33;padding:12px;text-align:center;color:#00a884;font-weight:bold}#info{background:#182229;padding:8px;text-align:center;font-size:11px}#online{background:#202c33;padding:8px;font-size:12px}#messages{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}.msg{background:#202c33;padding:8px 12px;border-radius:12px;max-width:85%;word-break:break-word}.msg b{color:#00a884;font-size:11px;display:block}.msg.mine{background:#005c4b;align-self:flex-end}img{max-width:180px;border-radius:8px}audio{width:200px}#form{display:flex;padding:10px;background:#202c33;gap:5px}#input{flex:1;padding:11px;border-radius:20px;border:none;outline:none}button{padding:10px 12px;border-radius:20px;border:none}#sendBtn{background:#00a884;color:#fff}#micBtn.rec{background:red;color:#fff}</style></head><body><header>🟢 FRAN-CHAT</header><div id="info"></div><div id="online">🟢 En ligne:...</div><div id="messages"></div><form id="form"><button type="button" onclick="file.click()">📸</button><button type="button" id="micBtn">🎤</button><input id="input" placeholder="Message"><input type="file" id="file" hidden accept="image/*"><button id="sendBtn" type="submit">▶️</button></form><script src="/socket.io/socket.io.js"></script><script>
let room=new URLSearchParams(location.search).get('groupe')||'general';
let nom=localStorage.getItem('fran-nom')||prompt("Ton nom?")||'Invité';
localStorage.setItem('fran-nom',nom);
info.innerHTML='Groupe:'+room+' | '+nom;
let s=io();s.emit('join room',{room:room,name:nom});
s.on('online users',u=>online.innerHTML='🟢 En ligne ('+u.length+'): '+[...new Set(u)].join(', '));
form.onsubmit=e=>{e.preventDefault();if(!input.value.trim())return;s.emit('chat message',{type:'text',data:input.value,name:nom});input.value=''};
file.onchange=()=>{let x=file.files[0];if(!x)return;let r=new FileReader();r.onload=()=>s.emit('chat message',{type:'image',data:r.result,name:nom});r.readAsDataURL(x)};

let rec, chunks=[], isRec=false;
function getMime(){
 if(MediaRecorder.isTypeSupported('audio/mp4'))return 'audio/mp4';
 if(MediaRecorder.isTypeSupported('audio/webm;codecs=opus'))return 'audio/webm;codecs=opus';
 if(MediaRecorder.isTypeSupported('audio/webm'))return 'audio/webm';
 return '';
}
micBtn.onclick=async()=>{
 if(!isRec){
  try{
   let stream=await navigator.mediaDevices.getUserMedia({audio:true});
   let mime=getMime();
   console.log('MIME:',mime);
   try{rec=new MediaRecorder(stream, mime?{mimeType:mime}:{});}catch{rec=new MediaRecorder(stream);}
   chunks=[];
   rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
   rec.onstop=()=>{
    let blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});
    console.log('Taille vocal:',blob.size);
    if(blob.size<1000){alert('Vocal vide, parle plus fort');return}
    let reader=new FileReader();
    reader.onload=()=>{
     s.emit('chat message',{type:'audio',data:reader.result,name:nom,mime:blob.type});
     console.log('Vocal envoyé');
    };
    reader.readAsDataURL(blob);
    stream.getTracks().forEach(t=>t.stop());
   };
   rec.start();
   isRec=true; micBtn.textContent='⏹️'; micBtn.classList.add('rec');
   setTimeout(()=>{if(isRec){rec.stop(); isRec=false; micBtn.textContent='🎤'; micBtn.classList.remove('rec');}}, 15000);
  }catch(e){alert('Micro bloqué: '+e.message+'\n1. Va dans Chrome > Paramètres > Autorisations > Micro > Autoriser fran-chat.vercel.app');}
 }else{
  rec.stop(); isRec=false; micBtn.textContent='🎤'; micBtn.classList.remove('rec');
 }
};
s.on('chat message',x=>{
 let d=document.createElement('div'); d.className='msg'+(x.name==nom?' mine':'');
 if(x.type=='image')d.innerHTML='<b>'+x.name+'</b><img src="'+x.data+'">';
 else if(x.type=='audio')d.innerHTML='<b>'+x.name+'</b><audio controls playsinline src="'+x.data+'"></audio>';
 else d.innerHTML='<b>'+x.name+'</b>'+(x.data||x);
 messages.appendChild(d); messages.scrollTop=999999;
});
</script></body></html>
