<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>FRAN-CHAT</title><style>*{box-sizing:border-box}body{margin:0;background:#111b21;color:#fff;height:100vh;display:flex;flex-direction:column;font-family:Arial}header{background:#202c33;padding:15px;text-align:center;color:#00a884;font-weight:bold}#messages{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:10px}.msg{background:#202c33;padding:10px 14px;border-radius:12px;max-width:85%}.msg img{max-width:200px;border-radius:10px;display:block}#form{display:flex;padding:10px;background:#202c33;gap:8px}#input{flex:1;padding:14px;border-radius:25px;border:none}#form button{padding:14px;border-radius:25px;border:none;font-weight:bold}#photoBtn{background:#2a3942}#sendBtn{background:#00a884}</style></head><body><header>🟢 FRAN-CHAT</header><div id="messages"><div class="msg">Bienvenue! Teste 📸</div></div><form id="form"><button id="photoBtn" type="button">📸</button><input id="input" placeholder="Message..."><input type="file" id="file" accept="image/*" hidden><button id="sendBtn" type="submit">Envoyer</button></form><script src="/socket.io/socket.io.js"></script><script>const s=io(),c=document.getElementById('messages'),i=document.getElementById('input'),f=document.getElementById('file');document.getElementById('photoBtn').onclick=()=>f.click();document.getElementById('form').onsubmit=e=>{e.preventDefault();if(!i.value.trim())return;s.emit('chat message',{type:'text',data:i.value});i.value=''};f.onchange=()=>{const x=f.files[0];if(!x)return;const r=new FileReader();r.onload=()=>s.emit('chat message',{type:'image',data:r.result});r.readAsDataURL(x)};s.on('chat message',m=>{const d=document.createElement('div');d.className='msg';if(typeof m==='string')d.textContent=m;else if(m.type==='image')d.innerHTML='<img src="'+m.data+'">';else d.textContent=m.data;c.appendChild(d);c.scrollTop=c.scrollHeight})</script></body></html>
